<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCL Watcher</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b6b6b; --line: #e2e2e2;
    --panel: #f7f7f7; --ok: #1a7f43; --warn: #9a6400; --err: #b3261e; --accent: #2b4c7e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181a; --fg: #e8e8e8; --muted: #9a9a9a; --line: #2e3236;
      --panel: #1e2124; --ok: #5bbd7f; --warn: #d6a44a; --err: #e8776e; --accent: #7ba3d6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; word-break: break-all; }
  .panel { border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; background: var(--panel); }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row + .row { margin-top: 10px; }
  input[type=text], select {
    flex: 1 1 260px; min-width: 0; padding: 7px 10px; font: inherit;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg);
  }
  button {
    padding: 7px 14px; font: inherit; cursor: pointer; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:hover { filter: brightness(1.08); }
  .stats { display: flex; gap: 24px; flex-wrap: wrap; }
  .stat b { display: block; font-size: 20px; font-weight: 600; }
  .stat span { color: var(--muted); font-size: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .scroll { overflow-x: auto; }
  .status { font-weight: 600; white-space: nowrap; }
  .s-OK { color: var(--ok); }
  .s-SKIPPED, .s-INFO, .s-WAITING { color: var(--muted); }
  .s-NEEDSREVIEW, .s-LOCKED { color: var(--warn); }
  .s-ERROR { color: var(--err); }
  .empty { color: var(--muted); font-style: italic; }
  code { background: var(--bg); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); }
  details { margin-top: 4px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">

  <h1>SCL Watcher</h1>
  <div class="sub">Watching <code id="folder">…</code></div>

  <div class="panel">
    <h2>Reference workbook</h2>
    <div id="wbState" class="empty">Loading…</div>
    <div class="row" style="margin-top:12px">
      <button class="primary" onclick="browse()">Choose file…</button>
      <select id="nearby" onchange="pickNearby()"><option value="">Workbooks near this folder…</option></select>
    </div>
    <details>
      <summary>Or type a full path</summary>
      <div class="row" style="margin-top:8px">
        <input type="text" id="pathInput" placeholder="C:\path\to\reference.xlsx">
        <button onclick="setPath()">Attach</button>
      </div>
    </details>
  </div>

  <div class="panel">
    <h2>Status</h2>
    <div class="stats">
      <div class="stat"><b id="imgCount">–</b><span>images in folder</span></div>
      <div class="stat"><b id="doneCount">–</b><span>handled this session</span></div>
      <div class="stat"><b id="lastScan">–</b><span>last scan</span></div>
      <div class="stat"><b><span class="dot"></span>live</b><span>checking every 2s</span></div>
    </div>
    <div class="row" style="margin-top:14px">
      <button onclick="rescan()">Re-check every file in the folder</button>
    </div>
  </div>

  <div class="panel">
    <h2>Activity</h2>
    <div class="scroll"><table id="events"><tbody><tr><td class="empty">Nothing yet. Save a screenshot into the folder.</td></tr></tbody></table></div>
  </div>

  <div class="panel">
    <h2>Processing history <span style="text-transform:none;letter-spacing:0">(from the workbook)</span></h2>
    <div class="scroll" id="history"><div class="empty">No workbook attached.</div></div>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);

async function getJSON(url)      { const r = await fetch(url); return r.json(); }
async function postJSON(url, b)  {
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b||{})});
  return r.json();
}

function render(s) {
  $('folder').textContent = s.folder;
  $('imgCount').textContent  = s.image_count;
  $('doneCount').textContent = s.handled_count;
  $('lastScan').textContent  = s.last_scan || '–';

  $('wbState').innerHTML = s.excel_path
    ? (s.excel_exists
        ? `<b>${s.excel_name}</b><br><span class="empty">${s.excel_path}</span>`
        : `<span class="s-ERROR status">Missing:</span> ${s.excel_path}`)
    : '<span class="empty">None attached. New screenshots will wait until you choose one.</span>';

  const sel = $('nearby');
  if (sel.dataset.sig !== JSON.stringify(s.nearby_workbooks)) {
    sel.dataset.sig = JSON.stringify(s.nearby_workbooks);
    sel.innerHTML = '<option value="">Workbooks near this folder…</option>' +
      s.nearby_workbooks.map(p => `<option value="${p.replace(/"/g,'&quot;')}">${p.split(/[\\/]/).pop()}</option>`).join('');
  }

  const tb = $('events').querySelector('tbody');
  tb.innerHTML = s.events.length
    ? s.events.map(e => `<tr>
        <td style="white-space:nowrap;color:var(--muted)">${e.time}</td>
        <td class="status s-${e.status.replace(/\s/g,'')}">${e.status}</td>
        <td>${e.file === '-' ? '' : '<b>' + e.file + '</b><br>'}${e.detail}</td>
      </tr>`).join('')
    : '<tr><td class="empty">Nothing yet. Save a screenshot into the folder.</td></tr>';
}

function renderHistory(h) {
  $('history').innerHTML = h.rows.length
    ? '<table><thead><tr>' + h.headers.map(x => `<th>${x}</th>`).join('') + '</tr></thead><tbody>'
      + h.rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('')
      + '</tbody></table>'
    : '<div class="empty">No history in this workbook yet.</div>';
}

async function browse() {
  const r = await postJSON('/api/browse');
  if (!r.ok && r.error) alert(r.error);
  tick();
}
async function setPath() {
  const r = await postJSON('/api/excel', {path: $('pathInput').value});
  if (!r.ok && r.error) alert(r.error);
  tick();
}
async function pickNearby() {
  const v = $('nearby').value;
  if (!v) return;
  const r = await postJSON('/api/excel', {path: v});
  if (!r.ok && r.error) alert(r.error);
  tick();
}
async function rescan() { await postJSON('/api/rescan'); tick(); }

async function tick() {
  try {
    render(await getJSON('/api/state'));
    renderHistory(await getJSON('/api/history'));
  } catch (e) {
    $('wbState').innerHTML = '<span class="s-ERROR status">Watcher stopped.</span> Close this tab and run the launcher again.';
  }
}

tick();
setInterval(tick, 2000);
</script>
</body>
</html>
