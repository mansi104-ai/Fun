<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mailwarden</title>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0a0a0a" />
<link rel="stylesheet" href="/brand.css" />
<style>
  /*
   * App shell. Shared tokens and controls live in brand.css; this file styles
   * the three things unique to the app: the state model, the review flow, and
   * the navigation.
   */

  /* ── State model ───────────────────────────────────────────────────
     Colour is never the only signal. Every state also carries a text label and
     a distinct glyph, so the model survives colour-blindness, grayscale, and
     a screen reader. */
  :root {
    --safe-ink:#0f6b43; --safe-bg:#eaf4ee;
    --review-ink:#8a5a00; --review-bg:#fbf2e3;
    --prot-ink:#41505f; --prot-bg:#eef1f4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --safe-ink:#8ccfa9; --safe-bg:#17231d;
      --review-ink:#dcb974; --review-bg:#241f11;
      --prot-ink:#a7b3c0; --prot-bg:#1b1f25;
    }
  }

  .wrap { max-width:840px; margin:0 auto; padding:0 clamp(14px,4vw,22px) 110px; }

  /* ── Header + nav ─────────────────────────────────────────────────── */
  header.top {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:16px 0 10px; flex-wrap:wrap;
  }
  .logo { display:flex; align-items:center; gap:10px; background:none; border:none;
          padding:0; color:var(--text); cursor:pointer; min-height:auto; }
  .logo-tile { display:grid; place-items:center; width:30px; height:30px; border-radius:8px;
               background:var(--brand-tile); color:var(--brand-ink); flex-shrink:0; }
  .logo-tile svg { width:21px; height:21px; display:block; }
  .logo-word { font-weight:640; font-size:1.02rem; letter-spacing:-0.02em; }
  .whoami { font-size:.82rem; color:var(--muted); }

  nav.tabs {
    display:flex; gap:2px; overflow-x:auto; scrollbar-width:none;
    border-bottom:1px solid var(--border); margin-bottom:24px;
  }
  nav.tabs::-webkit-scrollbar { display:none; }
  nav.tabs button {
    background:none; border:none; border-bottom:2px solid transparent; border-radius:0;
    color:var(--muted); padding:10px 13px; font:inherit; font-size:.92rem;
    font-weight:520; cursor:pointer; white-space:nowrap; min-height:44px;
  }
  nav.tabs button:hover { color:var(--text); background:none; }
  nav.tabs button[aria-current="page"] { color:var(--text); border-bottom-color:var(--text); font-weight:620; }
  nav.tabs .count { font-variant-numeric:tabular-nums; opacity:.6; margin-left:5px; }

  /* ── The headline decision ────────────────────────────────────────── */
  .verdict-num {
    font-size:clamp(1.75rem,5.5vw,2.4rem); font-weight:620; letter-spacing:-0.03em;
    line-height:1.15; margin:0 0 8px;
  }
  .verdict-guard {
    display:inline-flex; align-items:flex-start; gap:8px; margin-top:14px;
    font-size:.9rem; color:var(--safe-ink); background:var(--safe-bg);
    padding:8px 13px; border-radius:var(--radius-sm); font-weight:540;
  }
  .verdict-cta { margin:20px 0 4px; display:flex; gap:10px; flex-wrap:wrap; }

  /* ── Safe / Review / Protected ────────────────────────────────────── */
  .triptych { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:26px 0 6px; }
  @media (max-width:620px) { .triptych { grid-template-columns:1fr; } }
  .state-card {
    text-align:left; width:100%; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:15px 16px; cursor:pointer; min-height:auto;
  }
  .state-card:hover { border-color:var(--muted); background:var(--surface); }
  .state-tag {
    display:inline-flex; align-items:center; gap:6px; font-size:.7rem; font-weight:700;
    letter-spacing:.07em; text-transform:uppercase; padding:3px 8px; border-radius:5px;
  }
  .state-tag.safe { color:var(--safe-ink); background:var(--safe-bg); }
  .state-tag.review { color:var(--review-ink); background:var(--review-bg); }
  .state-tag.protected { color:var(--prot-ink); background:var(--prot-bg); }
  .state-n { font-size:1.55rem; font-weight:620; letter-spacing:-0.025em; margin:9px 0 1px;
             font-variant-numeric:tabular-nums; }
  .state-note { font-size:.84rem; color:var(--muted); }

  /* ── Sender cards ─────────────────────────────────────────────────── */
  .sender {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px 17px; margin-bottom:10px;
  }
  .sender-top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
  .sender-name { font-weight:600; overflow-wrap:anywhere; }
  .sender-meta { font-size:.84rem; color:var(--muted); margin-top:2px; }
  .sender-n { font-size:1.1rem; font-weight:620; font-variant-numeric:tabular-nums; white-space:nowrap; }

  .evidence { list-style:none; padding:0; margin:12px 0 0; }
  .evidence li { display:flex; gap:8px; font-size:.87rem; color:var(--muted);
                 padding:2px 0; align-items:flex-start; }
  .evidence li .mark { flex-shrink:0; font-weight:700; color:var(--safe-ink); }
  .evidence.held li .mark { color:var(--prot-ink); }

  .sender-actions { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .sender-actions button { flex:1 1 auto; min-width:118px; }

  /* ── Multi-select ─────────────────────────────────────────────────── */
  .sender.picked { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .pick { display:flex; align-items:flex-start; gap:11px; }
  /* 20px and a padded label: this is tapped on a phone far more than clicked. */
  .pick input { width:20px; height:20px; margin:2px 0 0; flex-shrink:0; cursor:pointer;
                accent-color:var(--accent); }
  .pick > div { min-width:0; flex:1; }

  .selbar {
    position:sticky; top:0; z-index:20; margin:0 0 12px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:11px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    box-shadow:0 2px 10px rgb(0 0 0 / .06);
  }
  .selbar .n { font-weight:620; font-variant-numeric:tabular-nums; }
  .selbar .grow { flex:1 1 auto; }
  .selbar button { min-height:38px; padding:7px 13px; }
  .selbar[hidden] { display:none; }

  /* ── Result bar ───────────────────────────────────────────────────
     Deliberately thin. It reports a finished action and offers to reverse it;
     it is not a page, and it must not push the list it describes off screen. */
  .flash {
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--safe-bg); color:var(--safe-ink);
    border-radius:var(--radius-sm); padding:9px 10px 9px 14px; margin:0 0 16px;
    font-size:.88rem; font-weight:540;
  }
  .flash .grow { flex:1 1 220px; min-width:0; }
  .flash .flash-note { color:inherit; opacity:.72; font-weight:450; }
  .flash button {
    background:transparent; color:inherit; border-color:currentColor;
    min-height:36px; padding:6px 14px; font-size:.85rem; font-weight:600;
  }
  .flash button:hover:not(:disabled) { background:rgb(0 0 0 / .07); }
  .flash button.close { border-color:transparent; padding:6px 10px; font-weight:400; }

  /* ── Focused review ───────────────────────────────────────────────── */
  .review-progress { font-size:.85rem; color:var(--muted); margin-bottom:10px;
                     display:flex; justify-content:space-between; gap:10px; }
  .review-bar { height:3px; background:var(--raised); border-radius:999px; overflow:hidden; margin-bottom:22px; }
  .review-bar > div { height:100%; background:var(--text); width:0; transition:width .25s ease; }
  .review-nav { display:flex; justify-content:space-between; gap:10px; margin-top:16px; }

  /* ── Generic ──────────────────────────────────────────────────────── */
  button {
    font:inherit; cursor:pointer; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface); color:var(--text); padding:9px 15px; min-height:42px;
  }
  button:hover:not(:disabled) { background:var(--raised); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .primary { background:var(--accent); color:var(--accent-fg); border-color:transparent; font-weight:620; }
  .primary:hover:not(:disabled) { opacity:.9; background:var(--accent); }
  .big { padding:13px 22px; font-size:1rem; min-height:48px; }
  .danger { color:var(--danger); }
  .link-btn { background:none; border:none; color:var(--accent-text); padding:6px 0;
              text-decoration:underline; min-height:auto; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .hint { font-size:.85rem; color:var(--muted); }
  .banner { background:var(--review-bg); color:var(--review-ink); padding:9px 16px;
            font-size:.86rem; text-align:center; font-weight:540; }

  .note { border-left:2px solid var(--border); background:var(--raised);
          padding:12px 14px; border-radius:var(--radius-sm); margin:14px 0; font-size:.88rem; }
  .note.safe { border-left-color:var(--safe-ink); }
  .note.warn { border-left-color:var(--warn); }
  .note.danger { border-left-color:var(--danger); }
  .note ul { margin:8px 0 0; padding-left:18px; }
  .note li { margin-bottom:4px; }

  .empty { text-align:center; padding:44px 18px; }
  .empty h2 { margin:0 0 8px; }

  .reason-row { display:flex; justify-content:space-between; gap:12px; align-items:baseline;
                padding:11px 0; border-bottom:1px solid var(--border); }
  .reason-row:last-child { border-bottom:none; }
  .reason-n { font-variant-numeric:tabular-nums; font-weight:620; white-space:nowrap; }

  .hist-row { display:flex; justify-content:space-between; gap:12px; align-items:center;
              padding:13px 0; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .hist-row:last-child { border-bottom:none; }

  dialog { border:1px solid var(--border); border-radius:var(--radius); background:var(--surface);
           color:var(--text); padding:22px; max-width:520px; width:calc(100% - 28px); }
  dialog::backdrop { background:rgba(0,0,0,.55); }
  dialog.reader { max-width:760px; max-height:86vh; padding:0; }
  dialog.reader[open] { display:flex; flex-direction:column; }
  .reader-head { display:flex; align-items:center; justify-content:space-between; gap:12px;
                 padding:15px 18px; border-bottom:1px solid var(--border); }
  .reader-head strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.93rem; }
  #readerBody { padding:16px 18px 22px; overflow-y:auto; }
  .msg { display:block; width:100%; text-align:left; border:none; border-radius:0;
         border-top:1px solid var(--border); background:none; padding:11px 4px; }
  .msg-sub { display:block; font-weight:570; font-size:.9rem; }
  .msg-meta { display:block; color:var(--muted); font-size:.78rem; margin:2px 0 3px; }
  .msg-snip { display:block; color:var(--muted); font-size:.82rem; }
  .msg-body { white-space:pre-wrap; overflow-wrap:anywhere; font:inherit; font-size:.89rem;
              line-height:1.6; margin:0; background:var(--raised); padding:14px;
              border-radius:var(--radius-sm); max-height:52vh; overflow-y:auto; }

  @media (max-width:560px) {
    .sender-actions button { flex:1 1 100%; }
    .verdict-cta .big { width:100%; }
  }
</style>
</head>
<body>
<div id="demoBanner" class="banner hidden">
  Demo inbox — synthetic data, no Gmail connected. Actions stop before the Gmail call.
</div>

<div class="wrap">
  <header class="top">
    <button class="logo" id="goHome" title="Overview">
      <span class="logo-tile" aria-hidden="true">
        <svg viewBox="0 0 100 100" fill="none">
          <rect x="18" y="30" width="64" height="44" rx="8" stroke="currentColor" stroke-width="8"/>
          <path d="M22 34l24 18a5 5 0 0 0 8 0l24-18" stroke="currentColor" stroke-width="8"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="logo-word">mailwarden</span>
    </button>
    <span class="whoami" id="plan"></span>
  </header>

  <nav class="tabs hidden" id="tabs" aria-label="Sections"></nav>

  <!-- The outcome of the last cleanup. Sits outside the sections so a list can
       redraw underneath it without taking the Undo button away with it. -->
  <div id="flash" class="flash hidden" role="status" aria-live="polite"></div>

  <section id="scan" class="hidden">
    <h1>Let's look at your inbox</h1>
    <p class="lede">
      Mailwarden reads headers only — sender, date, size, and Gmail's own labels.
      Message bodies are never part of the scan.
    </p>
    <button class="primary big" id="startScan">Scan my inbox</button>
    <div id="scanProgress" class="hidden" style="margin-top:22px">
      <div class="review-bar"><div id="bar"></div></div>
      <div class="hint" id="ticker" aria-live="polite">Connecting…</div>
    </div>
  </section>

  <section id="overview" class="hidden"></section>
  <section id="list" class="hidden"></section>
  <section id="review" class="hidden"></section>
  <section id="protectedView" class="hidden"></section>
  <section id="history" class="hidden"></section>
</div>

<dialog id="confirmDialog" aria-labelledby="confirmTitle">
  <h2 id="confirmTitle" style="margin:0 0 12px; font-size:1.1rem">Confirm</h2>
  <div id="confirmBody"></div>
  <div class="row" style="justify-content:flex-end; margin-top:18px">
    <button id="cancelConfirm">Cancel</button>
    <button class="primary" id="reallyConfirm">Confirm</button>
  </div>
</dialog>

<dialog id="readerDialog" class="reader" aria-labelledby="readerTitle">
  <div class="reader-head">
    <strong id="readerTitle"></strong>
    <button id="closeReader">Close</button>
  </div>
  <div id="readerBody"></div>
</dialog>

<script src="/analytics.js" defer></script>
<script type="module" src="/app.js"></script>
</body>
</html>
