<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Try Mailwarden on a test inbox</title>
<meta name="description" content="Add sample emails or write your own, pick an action, and see what Mailwarden would do with them — what it stores, what it redacts, and which guardrail holds each message back." />
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
<meta name="theme-color" content="#0a0a0a" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Try Mailwarden on a test inbox" />
<meta property="og:description" content="Add the mail, pick the action, see what would happen." />
<meta property="og:url" content="https://mailwarden.xyz/try.html" />
<meta property="og:image" content="https://mailwarden.xyz/brand/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Mailwarden wordmark on black, over the line “Clean your Gmail. Without losing what matters.” and three tags: Safe, Review, Protected." />
<meta name="twitter:card" content="summary_large_image" />
<link rel="canonical" href="https://mailwarden.xyz/try.html" />
<link rel="stylesheet" href="/brand.css" />

<style>
  /* Page-specific only. Everything shared lives in brand.css. */

  /*
   * Two channels, never three.
   *
   * The validator fails brand --danger (#b42318) against --warn (#b54708) at
   * ΔE 6.1 for normal vision — most readers cannot tell them apart. So charts
   * use --safe plus a neutral, and --danger appears only when it is alone (a
   * blocked batch moves nothing). Every mark is directly labelled, so colour
   * is never the only channel.
   */
  :root {
    --held-ink: var(--safe);
    --held-fill: #067647;
    --moved-fill: var(--n-500);
    --plot-track: var(--n-200);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --held-fill: #86c2a1;
      --moved-fill: #6f6f78;
      --plot-track: #26262a;
    }
  }

  .line { display: block; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* ── Panes ───────────────────────────────────────────────────────── */

  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 800px) { .panes { grid-template-columns: 1fr; } }

  .pane-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; margin-bottom: 8px;
  }
  .pane-head h3 { margin: 0; }
  .pane-scroll { max-height: 520px; overflow-y: auto; padding-right: 4px; }
  @media (max-width: 800px) { .pane-scroll { max-height: none; } }

  .group-h {
    font-size: .72rem; font-weight: 660; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); margin: 14px 0 6px;
  }
  .group-h:first-child { margin-top: 0; }

  .mail-list { display: grid; gap: 7px; }
  .mail {
    display: grid; grid-template-columns: 1fr auto; gap: 10px;
    align-items: center; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); width: 100%;
  }
  .mail.added { opacity: .45; }

  .mail-from { font-weight: 620; font-size: .9rem; }
  .mail-subject { font-size: .89rem; }
  .mail-meta { font-size: .78rem; color: var(--muted); }
  .mail-body {
    font-size: .8rem; color: var(--muted); margin-top: 4px;
    border-left: 2px solid var(--border); padding-left: 9px;
  }

  .mini {
    font: inherit; font-size: .82rem; font-weight: 600;
    padding: 6px 12px; min-height: 34px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); cursor: pointer; white-space: nowrap;
  }
  .mini:hover:not(:disabled) { background: var(--raised); }
  .mini:disabled { opacity: .5; cursor: default; }
  .mini.solid { background: var(--accent); color: var(--accent-fg); border-color: transparent; }

  .tag {
    display: inline-block; font-size: .68rem; font-weight: 600;
    letter-spacing: .03em; padding: 2px 7px; border-radius: 999px;
    background: var(--raised); color: var(--muted); margin: 4px 4px 0 0;
    font-family: var(--font-mono);
  }

  .empty {
    border: 1px dashed var(--border); border-radius: var(--radius-sm);
    padding: 28px 18px; text-align: center; color: var(--muted); font-size: .88rem;
  }

  /* ── Compose ─────────────────────────────────────────────────────── */

  .compose { border-top: 1px solid var(--border); margin-top: 20px; padding-top: 16px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .f { display: block; }
  .f > span { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 4px; }
  .f input, .f select, .f textarea { margin: 0; }

  .flags {
    border: 0; padding: 12px 0 0; margin: 0;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 2px 14px;
  }
  .flag {
    display: grid; grid-template-columns: 18px 1fr; gap: 8px;
    align-items: center; font-size: .84rem; padding: 3px 0; cursor: pointer;
  }
  /* Checkboxes inherit the 100%-width input rule from brand.css otherwise. */
  .flag input[type="checkbox"] {
    width: 16px; height: 16px; min-height: 0; margin: 0; padding: 0;
    accent-color: var(--text);
  }

  /* The rule is the privacy boundary made visible: above it is sent, below is not. */
  .stays { margin-top: 14px; padding-top: 12px; border-top: 2px dashed var(--held-ink); }
  .stays-tag {
    color: var(--held-ink); font-weight: 660; font-size: .72rem;
    letter-spacing: .03em; text-transform: uppercase;
  }

  /* ── Redaction ───────────────────────────────────────────────────── */

  .redact-pair {
    display: grid; grid-template-columns: 1fr 20px 1fr; gap: 10px; margin-bottom: 10px;
  }
  @media (max-width: 720px) { .redact-pair { grid-template-columns: 1fr; gap: 6px; } }

  .doc {
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 12px; background: var(--surface); min-width: 0;
  }
  .doc.kept { border-color: var(--held-ink); }
  .field { display: grid; grid-template-columns: 58px 1fr; gap: 8px; margin-bottom: 4px; font-size: .83rem; }
  .field-k { color: var(--muted); font-size: .76rem; padding-top: 1px; }
  .field-v { min-width: 0; overflow-wrap: anywhere; }

  /* A real bar: the withheld value is genuinely not in this element. */
  .bar {
    display: inline-block; height: .76em; border-radius: 2px;
    background: var(--text); opacity: .82; vertical-align: -1px; max-width: 100%;
  }
  .note { font-size: .73rem; color: var(--muted); }
  .arrow-col { display: grid; place-items: center; color: var(--muted); }
  @media (max-width: 720px) { .arrow-col { height: 16px; } }

  /* ── Charts ──────────────────────────────────────────────────────── */

  .tiles { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 16px; }
  .tile {
    flex: 1 1 130px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px 14px; background: var(--surface);
  }
  .tile-n { font-size: 1.7rem; font-weight: 660; letter-spacing: -.02em; line-height: 1.1; }
  .tile.held .tile-n { color: var(--held-ink); }
  .tile.refused .tile-n { color: var(--danger); }
  .tile-k { font-size: .78rem; color: var(--muted); margin-top: 2px; }

  .split { display: flex; gap: 2px; height: 13px; margin: 0 0 16px; }
  .split span { border-radius: 2px; min-width: 3px; }
  .split span:first-child { border-radius: 7px 2px 2px 7px; }
  .split span:last-child { border-radius: 2px 7px 7px 2px; }
  .split span:only-child { border-radius: 7px; }
  .split .s-held { background: var(--held-fill); }
  .split .s-moved { background: var(--moved-fill); }

  .keys { display: flex; gap: 16px; flex-wrap: wrap; font-size: .81rem; margin-bottom: 5px; }
  .key { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .key i { width: 10px; height: 10px; border-radius: 3px; display: block; }
  .key.held i { background: var(--held-fill); }
  .key.moved i { background: var(--moved-fill); }

  /* One hue for every bar: the categories are nominal, so length is the only
     thing worth encoding. */
  .bars { display: grid; gap: 7px; margin: 10px 0 16px; }
  .bar-row { display: grid; grid-template-columns: minmax(96px, 27%) 1fr auto; gap: 10px; align-items: center; }
  .bar-label { font-size: .81rem; overflow-wrap: anywhere; }
  .bar-label b { font-family: var(--font-mono); font-weight: 640; font-size: .78rem; }
  .bar-track { background: var(--plot-track); border-radius: 4px; height: 9px; }
  .bar-fill { background: var(--held-fill); border-radius: 4px; height: 9px; min-width: 4px; }
  .bar-n { font-family: var(--font-mono); font-size: .79rem; color: var(--muted); }
  @media (max-width: 560px) {
    .bar-row { grid-template-columns: 1fr auto; }
    .bar-row .bar-track { grid-column: 1 / -1; }
  }

  /* ── Results ─────────────────────────────────────────────────────── */

  .stage { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 20px; }
  .stage:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
  .stage h2 { margin: 0 0 12px; }

  .row { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: 0; }
  .mono { font-family: var(--font-mono); font-size: .79rem; }

  .chip {
    display: inline-block; font-size: .72rem; font-weight: 600;
    padding: 2px 8px; border-radius: 999px; margin: 3px 5px 0 0;
    border: 1px solid var(--border); color: var(--muted); font-family: var(--font-mono);
  }
  .chip.held { color: var(--held-ink); border-color: currentColor; }
  .chip.block { color: var(--danger); border-color: currentColor; }

  .verdict-protected { color: var(--held-ink); font-weight: 620; }
  .verdict-clean { color: var(--muted); font-weight: 620; }

  .guard { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .guard:last-child { border-bottom: 0; }
  .guard.idle { opacity: .5; }
  .guard-id { font-family: var(--font-mono); font-size: .77rem; font-weight: 640; min-width: 34px; color: var(--muted); }
  .guard.hit .guard-id { color: var(--text); }
  .guard-body { flex: 1; min-width: 0; }
  .guard-title { font-size: .88rem; font-weight: 600; }
  .guard-detail { font-size: .82rem; color: var(--muted); margin-top: 2px; }

  .callout { border-left: 3px solid var(--border); padding: 2px 0 2px 13px; margin: 0 0 14px; font-size: .87rem; }
  .callout.danger { border-color: var(--danger); }
  .callout.safe { border-color: var(--held-ink); color: var(--muted); }

  details.more { margin-top: 10px; }
  details.more summary { cursor: pointer; font-size: .84rem; color: var(--muted); }

  @media (max-width: 560px) { .btn-row .btn { width: auto; flex: 1 1 auto; } }
</style>
</head>
<body>
<main class="wrap wide">
  <a class="brand" href="/" aria-label="Mailwarden home">
    <span class="brand-tile" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <rect x="18" y="30" width="64" height="44" rx="8" stroke="currentColor" stroke-width="8"/>
        <path d="M22 34l24 18a5 5 0 0 0 8 0l24-18" stroke="currentColor" stroke-width="8"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span class="brand-word">mailwarden</span>
  </a>

  <h1 style="margin-top:24px">Try it on a test inbox</h1>
  <p class="lede">Add mail, pick an action, see what Mailwarden would do.</p>

  <section class="card">
    <div class="panes">
      <div>
        <div class="pane-head">
          <h3>Samples</h3>
          <button class="mini" type="button" data-pick="all">Add all</button>
        </div>
        <div class="pane-scroll" id="library"></div>
      </div>

      <div>
        <div class="pane-head">
          <h3>Test inbox <span id="inbox-count" class="muted"></span></h3>
          <button class="mini" type="button" data-pick="none">Empty</button>
        </div>
        <div class="pane-scroll" id="inbox" aria-live="polite"></div>
      </div>
    </div>

    <div id="compose" class="compose"></div>
  </section>

  <section class="card">
    <div class="btn-row">
      <button class="btn" type="button" data-run="archive" data-evt="try_archive">Archive</button>
      <button class="btn ghost" type="button" data-run="trash" data-evt="try_trash">Trash</button>
      <button class="btn ghost" type="button" data-run="delete" data-evt="try_delete">Delete permanently</button>
      <span class="muted" id="selection-note"></span>
    </div>
  </section>

  <section id="result" class="hidden" aria-live="polite"></section>

  <p class="muted" style="margin-top:36px; border-top:1px solid var(--border); padding-top:16px">
    <a href="/auth/google" data-evt="try_cta_signin">Connect your Gmail</a> ·
    <a href="/">Home</a> ·
    <a href="/pricing.html">Plans</a> ·
    <a href="/privacy.html">Privacy</a>
  </p>
</main>

<script src="/try.js" defer></script>
<script src="/analytics.js" defer></script>
</body>
</html>
